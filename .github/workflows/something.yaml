name: My First Action

# Triggers the workflow on every git push or pull request to the main branch
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # The type of virtual machine the runner uses
    steps:
      - uses: actions/checkout@v4

      - name: Install pack CLI
        uses: buildpacks/github-actions/setup-pack@v5

      - name: Build with Google buildpacks
        run: |
          pack build my-first-function \
            --builder gcr.io/buildpacks/builder:v1 \
            --env GOOGLE_FUNCTION_SIGNATURE_TYPE=http \
            --env GOOGLE_FUNCTION_TARGET=scanEmail
